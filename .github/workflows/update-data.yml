name: Update GameHub Data

on:
  schedule:
    # 每天北京时间 8:00, 12:00, 18:00, 22:00 各更新一次
    - cron: '0 0,4,10,14 * * *'
  # 允许手动触发
  workflow_dispatch:
  # 推送代码时也更新一次
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'export_data.py'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start local RSSHub instance
        run: |
          # 使用 Docker 启动 RSSHub 实例
          docker run -d --name rsshub -p 1200:1200 diygod/rsshub:latest
          # 等待 RSSHub 启动（最多 60 秒）
          for i in $(seq 1 60); do
            if curl -s http://localhost:1200/healthz | grep -q "ok"; then
              echo "✅ RSSHub 已就绪 (等待 ${i}s)"
              break
            fi
            sleep 1
          done
          # 验证 RSSHub 是否可用
          echo "--- RSSHub 健康检查 ---"
          curl -s http://localhost:1200/healthz || echo "❌ RSSHub 未就绪"
          # 测试各路由
          echo ""
          echo "--- 路由测试 ---"
          echo "1. HoYoLAB (绝区零):"
          curl -s -o /dev/null -w "  HTTP %{http_code}, %{size_download} bytes\n" "http://localhost:1200/hoyolab/news/zh-cn/8/1" || echo "  失败"
          echo "2. B站动态 (三角洲行动):"
          curl -s -o /dev/null -w "  HTTP %{http_code}, %{size_download} bytes\n" "http://localhost:1200/bilibili/user/dynamic/3494376565115651" || echo "  失败"
          echo "3. B站搜索 (三角洲行动):"
          curl -s -o /dev/null -w "  HTTP %{http_code}, %{size_download} bytes\n" "http://localhost:1200/bilibili/search/keyword/三角洲行动" || echo "  失败"
          echo "4. TapTap文章 (三角洲行动):"
          curl -s -o /dev/null -w "  HTTP %{http_code}, %{size_download} bytes\n" "http://localhost:1200/taptap/app/330259/articles" || echo "  失败"
          echo "5. 微博 (三角洲行动):"
          curl -s -o /dev/null -w "  HTTP %{http_code}, %{size_download} bytes\n" "http://localhost:1200/weibo/user/6188277234" || echo "  失败"
          # 测试三角洲行动 B站搜索路由的 RSS 内容
          echo ""
          echo "--- B站搜索路由内容预览 ---"
          curl -s "http://localhost:1200/bilibili/search/keyword/三角洲行动" | head -c 300 || true

      - name: Fetch game news
        run: python export_data.py --output ./dist/data
        env:
          TZ: Asia/Shanghai

      - name: Copy frontend files
        run: |
          # 复制前端HTML到dist目录
          if [ -f "index.html" ]; then
            cp index.html dist/
          fi
          # 如果有assets目录也复制
          if [ -d "assets" ]; then
            cp -r assets dist/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
