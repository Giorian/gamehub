name: Update GameHub Data

on:
  schedule:
    # 每天北京时间 8:00, 12:00, 18:00, 22:00 各更新一次
    - cron: '0 0,4,10,14 * * *'
  # 允许手动触发
  workflow_dispatch:
  # 推送代码时也更新一次
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'export_data.py'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js (for RSSHub)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start local RSSHub instance
        run: |
          # 安装并启动本地 RSSHub 实例，作为数据源
          # 本地实例不受公共镜像的速率限制
          npm install -g rsshub@latest
          # 后台启动 RSSHub，等待 15 秒使其就绪
          nohup npx rsshub > rsshub.log 2>&1 &
          sleep 15
          # 验证 RSSHub 是否启动成功
          curl -s http://localhost:1200/healthz || echo "RSSHub 未就绪，将使用公共镜像"

      - name: Fetch game news
        run: python export_data.py --output ./dist/data
        env:
          TZ: Asia/Shanghai

      - name: Copy frontend files
        run: |
          # 复制前端HTML到dist目录
          if [ -f "index.html" ]; then
            cp index.html dist/
          fi
          # 如果有assets目录也复制
          if [ -d "assets" ]; then
            cp -r assets dist/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
