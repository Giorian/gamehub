name: Update GameHub Data

on:
  schedule:
    # 每天北京时间 8:00, 12:00, 18:00, 22:00 各更新一次
    - cron: '0 0,4,10,14 * * *'
  # 允许手动触发
  workflow_dispatch:
  # 推送代码时也更新一次
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'export_data.py'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start local RSSHub instance
        run: |
          # 使用 Docker 启动 RSSHub 实例
          docker run -d --name rsshub -p 1200:1200 diygod/rsshub:latest
          # 等待 RSSHub 启动（最多 60 秒）
          for i in $(seq 1 60); do
            if curl -s http://localhost:1200/healthz | grep -q "ok"; then
              echo "✅ RSSHub 已就绪 (等待 ${i}s)"
              break
            fi
            sleep 1
          done
          # 验证 RSSHub 是否可用
          echo "--- RSSHub 健康检查 ---"
          curl -s http://localhost:1200/healthz || echo "❌ RSSHub 未就绪"
          # 测试各路由
          echo ""
          echo "--- RSSHub 路由测试 ---"
          echo "1. HoYoLAB (绝区零):"
          curl -s -o /dev/null -w "  HTTP %{http_code}, %{size_download} bytes\n" "http://localhost:1200/hoyolab/news/zh-cn/8/1" || echo "  失败"
          echo "2. B站动态 (三角洲行动):"
          curl -s -o /dev/null -w "  HTTP %{http_code}, %{size_download} bytes\n" "http://localhost:1200/bilibili/user/dynamic/3494376565115651" || echo "  失败"
          echo "3. 3DMGame (三角洲行动):"
          curl -s -o /dev/null -w "  HTTP %{http_code}, %{size_download} bytes\n" "http://localhost:1200/3dmgame/games/三角洲行动" || echo "  失败"
          echo "4. 微博 (三角洲行动):"
          curl -s -o /dev/null -w "  HTTP %{http_code}, %{size_download} bytes\n" "http://localhost:1200/weibo/user/6188277234" || echo "  失败"
          # 测试 B站文章API（不需要cookie）
          echo ""
          echo "--- B站文章API测试 ---"
          echo "5. B站文章 (终末地 UID=1265652806):"
          curl -s -w "  HTTP %{http_code}\n" "https://api.bilibili.com/x/space/article?mid=1265652806&pn=1&ps=5&sort=publish_time&platform=web" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              arts=d.get('data',{}).get('articles',[])
              print(f'    文章数: {len(arts)}')
              for a in arts[:2]:
                  print(f'    - {a.get(\"title\",\"\")[:40]}')
          except: print('    解析失败')
          " || echo "  失败"

          echo "6. B站文章 (三角洲行动 UID=3494376565115651):"
          curl -s -w "  HTTP %{http_code}\n" "https://api.bilibili.com/x/space/article?mid=3494376565115651&pn=1&ps=5&sort=publish_time&platform=web" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              arts=d.get('data',{}).get('articles',[])
              print(f'    文章数: {len(arts)}')
              for a in arts[:3]:
                  print(f'    - {a.get(\"title\",\"\")[:40]}')
          except: print('    解析失败')
          " || echo "  失败"

          # 测试 B站搜索API（不需要cookie）
          echo ""
          echo "--- B站搜索API测试 ---"
          echo "7. B站搜索 (三角洲行动):"
          curl -s -w "  HTTP %{http_code}\n" "https://api.bilibili.com/x/web-interface/search/type?search_type=article&keyword=%E4%B8%89%E8%A7%92%E6%B4%B2%E8%A1%8C%E5%8A%A8&order=pubdate&page=1" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              results=d.get('data',{}).get('result',[])
              print(f'    搜索结果: {len(results)}')
              for r in results[:3]:
                  t=r.get('title','').replace('<em class=\"keyword\">','').replace('</em>','')
                  print(f'    - {t[:40]}')
          except: print('    解析失败')
          " || echo "  失败"

          # 测试米游社详情API（绝区零）
          echo ""
          echo "--- 米游社详情API测试 ---"
          echo "8. 米游社帖子详情 (绝区零 post_id=77761555):"
          curl -s -w "  HTTP %{http_code}\n" "https://api-takumi.mihoyo.com/post/wapi/getPostFull?post_id=77761555" \
            -H "User-Agent: Mozilla/5.0" -H "Referer: https://www.miyoushe.com/" \
            -H "x-rpc-client_type: 4" -H "x-rpc-app_version: 2.71.1" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              post=d.get('data',{}).get('post',{}).get('post',{})
              c=post.get('content','')
              print(f'    retcode: {d.get(\"retcode\")}, content_len: {len(c)}')
          except: print('    解析失败')
          " || echo "  失败"

      - name: Fetch game news
        run: python export_data.py --output ./dist/data
        env:
          TZ: Asia/Shanghai

      - name: Copy frontend files
        run: |
          # 复制前端HTML到dist目录
          if [ -f "index.html" ]; then
            cp index.html dist/
          fi
          # 如果有assets目录也复制
          if [ -d "assets" ]; then
            cp -r assets dist/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
